<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4849304684017559"
     crossorigin="anonymous"></script>
<title>CV PRO AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef2f7;
    font-family:Arial,"Noto Sans",sans-serif;
    color:#222;
}

.app{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.title{
    text-align:center;
    color:#17365d;
    margin:10px 0 20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h2{
    color:#17365d;
    margin-top:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccd3dd;
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:20px;
}

button{
    border:0;
    padding:13px 18px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.generate{
    background:#17365d;
    color:white;
}

.pdf{
    background:#198754;
    color:white;
}

.clear{
    background:#dc3545;
    color:white;
}

.print{
    background:#6f42c1;
    color:white;
}

/* CV */

#cv{
    width:210mm;
    min-height:297mm;
    background:white;
    margin:20px auto;
    padding:18mm;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    overflow:hidden;
}

.cv-header{
    display:flex;
    align-items:flex-start;
    gap:22px;
    padding-bottom:20px;
    border-bottom:3px solid #17365d;
}

.photo{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #ddd;
    flex-shrink:0;
}

.info{
    flex:1;
    min-width:0;
}

.name{
    margin:0;
    color:#17365d;
    font-size:34px;
    line-height:1.15;

    /* IMPORTANT */
    white-space:normal !important;
    overflow:visible !important;
    text-overflow:clip !important;
    overflow-wrap:anywhere !important;
    word-break:break-word !important;
}

.contact{
    margin-top:10px;
    line-height:1.7;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.section{
    margin-top:22px;
}

.section-title{
    color:#17365d;
    font-size:19px;
    font-weight:bold;
    border-bottom:2px solid #17365d;
    padding-bottom:5px;
    margin-bottom:10px;
}

.content{
    white-space:pre-line;
    line-height:1.7;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.tag{
    background:#edf2f7;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    overflow-wrap:anywhere;
}

/* Templates */

.t1 .cv-header{
    border-bottom-color:#17365d;
}

.t2{
    border-top:12px solid #111 !important;
}

.t2 .cv-header{
    background:#f1f1f1;
    padding:18px;
    border-bottom:0;
}

.t2 .name,
.t2 .section-title{
    color:#111;
}

.t2 .section-title{
    border-color:#111;
}

.t3{
    font-family:Georgia,serif;
}

.t3 .cv-header{
    display:block;
    text-align:center;
}

.t3 .photo{
    margin-bottom:12px;
}

.t3 .name{
    text-align:center;
    color:#806000;
}

.t3 .section-title{
    color:#806000;
    border-color:#b89a42;
}

.t4 .cv-header{
    border-left:8px solid #198754;
    padding-left:15px;
}

.t4 .name,
.t4 .section-title{
    color:#198754;
}

.t4 .section-title{
    border-color:#198754;
}

.t5 .cv-header{
    background:#fff3f3;
    padding:18px;
    border-left:8px solid #dc3545;
}

.t5 .name,
.t5 .section-title{
    color:#b02a37;
}

.t5 .section-title{
    border-color:#dc3545;
}

.t6 .cv-header{
    background:#17365d;
    padding:20px;
    color:white;
    border:0;
}

.t6 .name{
    color:white;
}

.t6 .section-title{
    color:#17365d;
}

.t7{
    background:#202124 !important;
    color:#eee;
}

.t7 .cv-header{
    background:#111;
    padding:20px;
    border:0;
}

.t7 .name{
    color:white;
}

.t7 .section-title{
    color:white;
    border-color:#777;
}

.t7 .tag{
    background:#444;
    color:white;
}

.t8 .cv-header{
    border-bottom:6px solid #f57c00;
}

.t8 .name,
.t8 .section-title{
    color:#e65100;
}

.t8 .section-title{
    border-color:#f57c00;
}

.t9{
    padding:25mm !important;
}

.t9 .cv-header{
    border-bottom:1px solid #aaa;
}

.t9 .name{
    color:#222;
    font-weight:normal;
}

.t9 .section-title{
    color:#333;
    border-color:#ccc;
    font-weight:normal;
}

.t10 .cv-header{
    background:#fff0f6;
    padding:20px;
    border-radius:10px;
}

.t10 .name,
.t10 .section-title{
    color:#c2185b;
}

.t10 .section-title{
    border-color:#e91e63;
}

/* Mobile */

@media(max-width:700px){

    #cv{
        width:100%;
        min-height:auto;
        padding:20px;
    }

    .cv-header{
        flex-direction:column;
    }

    .info{
        width:100%;
    }

    .name{
        font-size:27px;
    }

    .buttons button{
        width:100%;
    }
}

/* Print */

@media print{

    body{
        background:white;
    }

    .panel,
    .title{
        display:none;
    }

    #cv{
        margin:0;
        width:210mm;
        box-shadow:none;
    }
}
</style>
</head>

<body>

<div class="app">

<h1 class="title">📄 CV PRO AI</h1>

<div class="panel">

<h2>👤 Personal Information</h2>

<label>Full Name</label>
<input
    id="name"
    type="text"
    placeholder="محمد رضوان / Muhammad Rizwan"
>

<label>Email</label>
<input
    id="email"
    type="email"
    placeholder="example@email.com"
>

<label>Contact</label>
<input
    id="phone"
    type="text"
    placeholder="+92 300 1234567"
>

<label>Address</label>
<textarea
    id="address"
    placeholder="Your address"
></textarea>

<label>Profile Photo</label>
<input
    id="photo"
    type="file"
    accept="image/*"
>

<h2>🎨 CV Template</h2>

<select id="template">
    <option value="t1">Template 1 - Classic</option>
    <option value="t2">Template 2 - Modern</option>
    <option value="t3">Template 3 - Elegant</option>
    <option value="t4">Template 4 - Green</option>
    <option value="t5">Template 5 - Red</option>
    <option value="t6">Template 6 - Professional</option>
    <option value="t7">Template 7 - Dark</option>
    <option value="t8">Template 8 - Orange</option>
    <option value="t9">Template 9 - Minimal</option>
    <option value="t10">Template 10 - Pink</option>
</select>

<h2>🎓 Education</h2>

<textarea
    id="education"
    placeholder="FA / Intermediate&#10;Government Higher Secondary School&#10;Computer Diploma"
></textarea>

<h2>💼 Work Experience</h2>

<textarea
    id="experience"
    placeholder="Company Name&#10;Job Title&#10;Responsibilities"
></textarea>

<h2>⭐ Skills</h2>

<textarea
    id="skills"
    placeholder="Computer Skills, MS Office, Data Entry, Communication"
></textarea>

<h2>🌐 Languages</h2>

<textarea
    id="languages"
    placeholder="Urdu, English, Punjabi"
></textarea>

<div class="buttons">

<button
    id="generateBtn"
    class="generate"
    type="button"
>
👁️ Generate CV
</button>

<button
    id="pdfBtn"
    class="pdf"
    type="button"
>
📄 Save CV as PDF
</button>

<button
    id="printBtn"
    class="print"
    type="button"
>
🖨️ Print
</button>

<button
    id="clearBtn"
    class="clear"
    type="button"
>
🗑️ Clear
</button>

</div>

</div>


<!-- CV -->

<div id="cv" class="t1">

    <div class="cv-header">

        <img
            id="pPhoto"
            class="photo"
            style="display:none"
            alt="Profile Photo"
        >

        <div class="info">

            <h1
                id="pName"
                class="name"
                dir="auto"
            >
                Your Name
            </h1>

            <div
                id="pContact"
                class="contact"
                dir="auto"
            >
                Email | Contact | Address
            </div>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            EDUCATION
        </div>

        <div
            id="pEducation"
            class="content"
            dir="auto"
        >
            Your education details
        </div>

    </div>


    <div class="section">

        <div class="section-title">
            WORK EXPERIENCE
        </div>

        <div
            id="pExperience"
            class="content"
            dir="auto"
        >
            Your work experience
        </div>

    </div>


    <div class="section">

        <div class="section-title">
            SKILLS
        </div>

        <div
            id="pSkills"
            class="tags"
        ></div>

    </div>


    <div class="section">

        <div class="section-title">
            LANGUAGES
        </div>

        <div
            id="pLanguages"
            class="tags"
        ></div>

    </div>

</div>

</div>


<script>

/* =====================================
   GET ELEMENTS
===================================== */

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const addressInput = document.getElementById("address");
const educationInput = document.getElementById("education");
const experienceInput = document.getElementById("experience");
const skillsInput = document.getElementById("skills");
const languagesInput = document.getElementById("languages");

const templateInput =
    document.getElementById("template");

const photoInput =
    document.getElementById("photo");

const cv =
    document.getElementById("cv");

const pName =
    document.getElementById("pName");

const pContact =
    document.getElementById("pContact");

const pEducation =
    document.getElementById("pEducation");

const pExperience =
    document.getElementById("pExperience");

const pSkills =
    document.getElementById("pSkills");

const pLanguages =
    document.getElementById("pLanguages");

const pPhoto =
    document.getElementById("pPhoto");


/* =====================================
   GENERATE CV
===================================== */

function generateCV(){

    const name =
        nameInput.value.trim();

    const email =
        emailInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const address =
        addressInput.value.trim();

    const education =
        educationInput.value.trim();

    const experience =
        experienceInput.value.trim();

    const skills =
        skillsInput.value.trim();

    const languages =
        languagesInput.value.trim();


    /* Name */

    pName.textContent =
        name || "Your Name";

    pName.dir = "auto";


    /* Contact */

    const contactParts = [];

    if(email)
        contactParts.push(email);

    if(phone)
        contactParts.push(phone);

    if(address)
        contactParts.push(address);

    pContact.textContent =
        contactParts.length
        ? contactParts.join(" | ")
        : "Email | Contact | Address";

    pContact.dir = "auto";


    /* Education */

    pEducation.textContent =
        education || "Your education details";


    /* Experience */

    pExperience.textContent =
        experience || "Your work experience";


    /* Skills */

    pSkills.innerHTML = "";

    if(skills){

        skills
        .split(/[,،\n]+/)
        .forEach(function(item){

            const value =
                item.trim();

            if(value){

                const tag =
                    document.createElement("span");

                tag.className = "tag";

                tag.textContent = value;

                tag.dir = "auto";

                pSkills.appendChild(tag);
            }
        });

    }else{

        addTag(pSkills,"Your Skills");
    }


    /* Languages */

    pLanguages.innerHTML = "";

    if(languages){

        languages
        .split(/[,،\n]+/)
        .forEach(function(item){

            const value =
                item.trim();

            if(value){

                const tag =
                    document.createElement("span");

                tag.className = "tag";

                tag.textContent = value;

                tag.dir = "auto";

                pLanguages.appendChild(tag);
            }
        });

    }else{

        addTag(pLanguages,"Urdu");
    }
}


/* =====================================
   ADD TAG
===================================== */

function addTag(parent,text){

    const tag =
        document.createElement("span");

    tag.className = "tag";

    tag.textContent = text;

    parent.appendChild(tag);
}


/* =====================================
   TEMPLATE
===================================== */

function changeTemplate(){

    const selected =
        templateInput.value;

    cv.className =
        selected;

    generateCV();
}


/* =====================================
   PHOTO
===================================== */

function loadPhoto(){

    const file =
        photoInput.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("image/")){

        alert("Please select an image.");

        photoInput.value = "";

        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(event){

            pPhoto.src =
                event.target.result;

            pPhoto.style.display =
                "block";
        };

    reader.readAsDataURL(file);
}


/* =====================================
   PDF
===================================== */

async function savePDF(){

    generateCV();

    if(typeof html2canvas === "undefined"){

        alert(
            "PDF library load نہیں ہوئی۔ Internet connection check کریں۔"
        );

        return;
    }

    if(!window.jspdf){

        alert(
            "PDF system load نہیں ہوا۔ Page refresh کریں۔"
        );

        return;
    }


    const button =
        document.getElementById("pdfBtn");

    button.disabled = true;

    button.textContent =
        "⏳ Creating PDF...";


    try{

        /*
        Wait for browser rendering
        */

        await new Promise(function(resolve){

            setTimeout(resolve,1000);

        });


        const canvas =
            await html2canvas(

                cv,

                {
                    scale:2,
                    useCORS:true,
                    allowTaint:true,
                    backgroundColor:"#ffffff",
                    logging:false,

                    windowWidth:
                        cv.scrollWidth,

                    windowHeight:
                        cv.scrollHeight
                }

            );


        const imgData =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF({

                orientation:"portrait",

                unit:"mm",

                format:"a4",

                compress:true
            });


        const pageWidth =
            pdf.internal.pageSize.getWidth();

        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const imgWidth =
            pageWidth;

        const imgHeight =
            canvas.height *
            imgWidth /
            canvas.width;


        let heightLeft =
            imgHeight;

        let position = 0;


        pdf.addImage(
            imgData,
            "JPEG",
            0,
            position,
            imgWidth,
            imgHeight
        );


        heightLeft -= pageHeight;


        while(heightLeft > 0){

            position =
                heightLeft - imgHeight;

            pdf.addPage();

            pdf.addImage(
                imgData,
                "JPEG",
                0,
                position,
                imgWidth,
                imgHeight
            );

            heightLeft -= pageHeight;
        }


        let fileName =
            nameInput.value.trim();

        if(!fileName){
            fileName = "Professional_CV";
        }


        fileName =
            fileName
            .replace(/[\/\\:*?"<>|]/g,"_")
            .replace(/\s+/g,"_");


        pdf.save(
            fileName + ".pdf"
        );


    }catch(error){

        console.error(error);

        alert(
            "PDF بنانے میں مسئلہ آیا۔ دوبارہ کوشش کریں۔"
        );

    }


    button.disabled = false;

    button.textContent =
        "📄 Save CV as PDF";
}


/* =====================================
   PRINT
===================================== */

function printCV(){

    generateCV();

    setTimeout(function(){

        window.print();

    },300);
}


/* =====================================
   CLEAR
===================================== */

function clearForm(){

    const confirmClear =
        confirm(
            "کیا آپ تمام معلومات صاف کرنا چاہتے ہیں؟"
        );

    if(!confirmClear){
        return;
    }


    nameInput.value = "";
    emailInput.value = "";
    phoneInput.value = "";
    addressInput.value = "";
    educationInput.value = "";
    experienceInput.value = "";
    skillsInput.value = "";
    languagesInput.value = "";

    photoInput.value = "";

    templateInput.value = "t1";

    cv.className = "t1";

    pPhoto.src = "";

    pPhoto.style.display =
        "none";

    generateCV();
}


/* =====================================
   BUTTON EVENTS
===================================== */

document
    .getElementById("generateBtn")
    .addEventListener(
        "click",
        generateCV
    );


document
    .getElementById("pdfBtn")
    .addEventListener(
        "click",
        savePDF
    );


document
    .getElementById("printBtn")
    .addEventListener(
        "click",
        printCV
    );


document
    .getElementById("clearBtn")
    .addEventListener(
        "click",
        clearForm
    );


templateInput
    .addEventListener(
        "change",
        changeTemplate
    );


photoInput
    .addEventListener(
        "change",
        loadPhoto
    );


/* =====================================
   LIVE PREVIEW
===================================== */

[
    nameInput,
    emailInput,
    phoneInput,
    addressInput,
    educationInput,
    experienceInput,
    skillsInput,
    languagesInput
]
.forEach(function(input){

    input.addEventListener(
        "input",
        generateCV
    );

});


/* =====================================
   INITIAL CV
===================================== */

generateCV();

</script>

</body>
</html>
